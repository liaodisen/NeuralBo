[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralbo"
version = "0.1.0"
description = "Reusable PyTorch library for bilevel optimization in neural networks."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "NeuralBo Contributors" }]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
